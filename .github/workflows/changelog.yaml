name: Changelog

on:
  pull_request:
    # labeled/unlabeled so that adding skip-changelog-check reruns the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog fragment convention
        env:
          ALLOW_CHANGELOG_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog-check') }}
        run: |
          python3 scripts/check-changelog.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
