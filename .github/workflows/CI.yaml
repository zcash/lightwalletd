name: CI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      mirror_tag:
        description: "Copy this electriccoinco/lightwalletd tag to zodlinc (vX.Y.Z); empty = no mirror"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Build and test
        run: |
          make
          make test

      - name: Race conditions test
        run: make race

      - name: Test Docker build
        run: docker build .

  docker_push:
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (electriccoinco)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push to electriccoinco
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            electriccoinco/lightwalletd:${{ github.event.release.tag_name }}
            electriccoinco/lightwalletd:latest

  # Separate from docker_push: the electriccoinco login there and a zodlinc login are both for
  # docker.io, so one tool cannot hold both, and reading the public source with the zodlinc org
  # token fails ("access token has insufficient scopes", v0.5.4 and v0.5.5). skopeo reads the
  # source anonymously, writes with the zodlinc credentials, and copies the multi-arch index as
  # is, so zodlinc gets the same digest. Also runnable by hand: workflow_dispatch with mirror_tag.
  zodlinc_mirror:
    needs: [docker_push]
    if: >-
      always() &&
      ((github.event_name == 'release' && needs.docker_push.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.mirror_tag != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Copy electriccoinco/lightwalletd to zodlinc
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.mirror_tag }}
          EVENT: ${{ github.event_name }}
          DST_USER: ${{ secrets.ZODLINC_DOCKERHUB_USERNAME }}
          DST_PASS: ${{ secrets.ZODLINC_DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$DISPATCH_TAG}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          TAGS="$TAG"
          # A release also moves latest; a manual run copies only the tag it names.
          [ "$EVENT" = release ] && TAGS="$TAG latest"
          for t in $TAGS; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              --src-no-creds --dest-creds "${DST_USER}:${DST_PASS}" \
              "docker://docker.io/electriccoinco/lightwalletd:$t" \
              "docker://docker.io/zodlinc/lightwalletd:$t"
            src=$(skopeo inspect --raw --no-creds "docker://docker.io/electriccoinco/lightwalletd:$t" | sha256sum | cut -d' ' -f1)
            dst=$(skopeo inspect --raw --no-creds "docker://docker.io/zodlinc/lightwalletd:$t" | sha256sum | cut -d' ' -f1)
            echo "$t: electriccoinco sha256:$src zodlinc sha256:$dst"
            [ "$src" = "$dst" ] || { echo "::error::digest mismatch for $t"; exit 1; }
          done
